[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tesis-enasem"
version = "0.1.0"
description = "Investigacion longitudinal reproducible: alerta temprana de vulnerabilidad economica en ENASEM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "seaborn>=0.13", "scikit-learn>=1.4", "statsmodels>=0.14"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
